[project]
name = "resteer"
version = "0.1.0"
description = "ReSteer: quantifying and refining the steerability of multitask robot policies (LIBERO simulation side)"
readme = "README.md"
license = { file = "LICENSE" }
# numpy 1.22.4 (the version the paper's LIBERO environment used) has no wheels past CPython 3.10.
requires-python = ">=3.10,<3.11"
dependencies = [
    # Simulation (versions match the environment used for the paper's evaluations).
    "numpy==1.22.4",
    "mujoco==3.2.3",
    "robosuite==1.4.1",
    "bddl==1.0.1",
    "future",  # imported by bddl but not declared by it
    "easydict",
    "pyyaml",
    "libero",
    # I/O and utilities.
    "h5py==3.10.0",
    "scipy==1.10.1",
    "opencv-python==4.6.0.66",
    "pillow==10.4.0",
    "imageio[ffmpeg]==2.35.1",  # rollout videos (--save-video)
    "transforms3d==0.4.2",
    "tyro>=0.9.2",
    "tqdm",
    # Policy client (openpi websocket protocol).
    "websockets>=13",
    "msgpack>=1.0.5",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
# robosuite pulls in pynput (keyboard teleop), which builds evdev from source; ReSteer never uses it.
override-dependencies = ["pynput ; sys_platform == 'never'"]

[tool.uv.sources]
libero = { path = "third_party/libero", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["resteer"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]
ignore = ["B905"]

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "sim: needs MuJoCo rendering (EGL)",
    "server: needs a running policy server",
]
